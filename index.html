<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Kakao 지도 - 강원도 CCTV 및 학교 지도</title>
<style>
/* 화면 전체를 지도로 가득 채우기 */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
#map { width: 100%; height: 100%; }

/* 박스 배경과 테두리를 완전히 없애고 시·군 이름 글자만 선명하게 노출하는 스타일 */
.region-label {
	font-size: 12px;
	font-weight: bold;
	color: #D32F2F; 
	text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff; 
	white-space: nowrap;
	pointer-events: none;
}

/* 학교 마커 - 빨간색 원 */
.circle-marker {
	width: 3px;
	height: 3px;
	background-color: #ff4500; 
	border: 2px solid #ffffff; 
	border-radius: 50%; 
	box-shadow: 0px 0px 4px rgba(0,0,0,0.4);
	pointer-events: none;
}

/* 학교명 라벨 */
.school-text-label {
	font-size: 11px;
	font-weight: bold;
	color: #333333;
	text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
	white-space: nowrap;
	display: none;
	pointer-events: none;
}

/* CCTV 마커 - 녹색 사각형 */
.cctv-marker {
	width: 5px;
	height: 5px;
	background-color: #00CC00;
	border: 1px solid #FFFFFF;
	box-sizing: border-box;
	box-shadow: 0px 0px 3px rgba(0,0,0,0.3);
	pointer-events: none;
}

/* 거리 라벨 */
.distance-label {
	font-size: 11px;
	font-weight: bold;
	color: #FF0000;
	text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
	white-space: nowrap;
	pointer-events: none;
}

/* CCTV 텍스트 라벨 - 녹색 */
.cctv-text-label {
	font-size: 10px;
	font-weight: bold;
	color: #00CC00;
	text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
	white-space: nowrap;
	display: block;
	pointer-events: none;
}
</style>
</head>
<body>
<div id="map"></div>
	
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=41901e122c28c17b591520173d54190d&libraries=services"></script>
<script>
var container = document.getElementById('map');
var options = {
	center: new kakao.maps.LatLng(37.8285, 128.1500), 
	level: 11 
};
var map = new kakao.maps.Map(container, options);

map.setZoomable(true); 
container.addEventListener('dblclick', function(e) {
	e.preventDefault();
}, true);

var schoolMarkerElements = [];
var schoolNameElements = [];
var cctvData = [];
var displayedCCTVOverlays = [];
var cctvMarkerElements = [];

// 학교 데이터 로드
fetch('schools.json')
	.then(function(response) {
		if (!response.ok) throw new Error('학교 데이터 파일을 찾을 수 없습니다.');
		return response.json();
	})
	.then(function(schoolsData) {
		var anchors = [
			{ x: 0.5,  y: 1.4 },  
			{ x: 0.5,  y: -0.4 }, 
			{ x: 1.1,  y: 0.5 },  
			{ x: -0.1, y: 0.5 }   
		];

		schoolsData.forEach(function(school, index) {
			var latlng = new kakao.maps.LatLng(school.lat, school.lng);

			var markerContent = document.createElement('div');
			markerContent.className = 'circle-marker';
			markerContent.style.width = '3px';
			markerContent.style.height = '3px';
			schoolMarkerElements.push(markerContent);

			new kakao.maps.CustomOverlay({
				position: latlng,
				content: markerContent,
				xAnchor: 0.5, 
				yAnchor: 0.5 
			}).setMap(map);

			var anchorIndex = 0; 
			for (var i = 0; i < index; i++) {
				var prev = schoolsData[i];
				var latDiff = Math.abs(school.lat - prev.lat);
				var lngDiff = Math.abs(school.lng - prev.lng);
				
				if (latDiff < 0.015 && lngDiff < 0.015) {
					anchorIndex = (anchorIndex + 1) % anchors.length; 
				}
			}
			var chosenAnchor = anchors[anchorIndex];

			var nameElem = document.createElement('div');
			nameElem.className = 'school-text-label';
			nameElem.innerText = school.name;
			schoolNameElements.push(nameElem);

			new kakao.maps.CustomOverlay({
				position: latlng,
				content: nameElem,
				xAnchor: chosenAnchor.x, 
				yAnchor: chosenAnchor.y
			}).setMap(map);
		});
		
		console.log('학교 데이터 로드 완료:', schoolsData.length);
	})
	.catch(function(error) {
		console.error('학교 데이터 로드 에러:', error);
	});

// CCTV 데이터 로드
fetch('cctv.json')
	.then(function(response) {
		if (!response.ok) throw new Error('CCTV 데이터 파일을 찾을 수 없습니다.');
		return response.json();
	})
	.then(function(data) {
		cctvData = data;
		console.log('CCTV 데이터 로드 완료:', cctvData.length);
	})
	.catch(function(error) {
		console.error('CCTV 데이터 로드 에러:', error);
	});

// CCTV 마커 표시/갱신 함수
function displayCCTVMarkers() {
	var currentLevel = map.getLevel();
	
	// 기존 CCTV 마커 제거
	displayedCCTVOverlays.forEach(function(overlay) {
		overlay.setMap(null);
	});
	displayedCCTVOverlays = [];
	cctvMarkerElements = [];

	// currentLevel > 5일 때는 표시 안 함
	if (currentLevel > 5 || cctvData.length === 0) {
		return;
	}

	// 현재 지도 중심
	var center = map.getCenter();
	var centerLat = center.getLat();
	var centerLng = center.getLng();
	
	var latMin = centerLat - 0.2;
	var latMax = centerLat + 0.2;
	var lngMin = centerLng - 0.2;
	var lngMax = centerLng + 0.2;

	var displayedCount = 0;
	var newSize = 5;

	// 줌 레벨에 따른 크기 설정
	if (currentLevel === 1) { newSize = 16; } 
	else if (currentLevel === 2) { newSize = 14; } 
	else if (currentLevel === 3) { newSize = 12; } 
	else if (currentLevel === 4) { newSize = 11; } 
	else if (currentLevel === 5) { newSize = 9; }

	// 범위 내의 CCTV만 표시
	for (var i = 0; i < cctvData.length; i++) {
		var cctv = cctvData[i];
		if (cctv.lat >= latMin && cctv.lat <= latMax && 
		    cctv.lng >= lngMin && cctv.lng <= lngMax) {
			
			var latlng = new kakao.maps.LatLng(cctv.lat, cctv.lng);
			
			// 마커와 텍스트를 담을 컨테이너 생성
			var container = document.createElement('div');
			container.style.display = 'flex';
			container.style.alignItems = 'center';
			container.style.gap = '3px';
			container.style.pointerEvents = 'none';
			
			// 마커 생성
			var markerContent = document.createElement('div');
			markerContent.className = 'cctv-marker';
			markerContent.style.width = newSize + 'px';
			markerContent.style.height = newSize + 'px';
			markerContent.style.flexShrink = '0';
			cctvMarkerElements.push(markerContent);
			
			// 텍스트 라벨 생성
			var nameElem = document.createElement('div');
			nameElem.className = 'cctv-text-label';
			nameElem.innerText = cctv.name;
			nameElem.style.fontSize = '10px';
			nameElem.style.fontWeight = 'bold';
			nameElem.style.color = '#00CC00';
			nameElem.style.textShadow = '-1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff';
			nameElem.style.whiteSpace = 'nowrap';
			nameElem.style.pointerEvents = 'none';
			
			// 컨테이너에 추가
			container.appendChild(markerContent);
			container.appendChild(nameElem);

			var overlay = new kakao.maps.CustomOverlay({
				position: latlng,
				content: container,
				xAnchor: 0.5,
				yAnchor: 0.5,
				clickable: false
			});
			overlay.setMap(map);
			displayedCCTVOverlays.push(overlay);
			displayedCount++;
		}
	}

	console.log('표시된 CCTV 개수:', displayedCount);
}

var isPoiHidden = false;

// 줌/드래그 이벤트
kakao.maps.event.addListener(map, 'zoom_changed', function() {
	var currentLevel = map.getLevel(); 
	var newSize = 1; 

	if (currentLevel === 1) { newSize = 16; } 
	else if (currentLevel === 2) { newSize = 14; } 
	else if (currentLevel === 3) { newSize = 12; } 
	else if (currentLevel === 4) { newSize = 11; } 
	else if (currentLevel === 5) { newSize = 9; } 
	else if (currentLevel === 6) { newSize = 8; } 
	else if (currentLevel === 7) { newSize = 7; } 
	else if (currentLevel === 8) { newSize = 6; } 
	else if (currentLevel === 9) { newSize = 5; } 
	else if (currentLevel === 10) { newSize = 4; } 
	else if (currentLevel === 11) { newSize = 3; } 
	else if (currentLevel === 12) { newSize = 2; } 
	else if (currentLevel === 13) { newSize = 1.5; } 
	else { newSize = 1; }

	schoolMarkerElements.forEach(function(markerElem) {
		markerElem.style.width = newSize + 'px';
		markerElem.style.height = newSize + 'px';
	});

	var nameDisplay = (currentLevel <= 9) ? 'block' : 'none';

	schoolNameElements.forEach(function(nameElem) {
	    nameElem.style.display = nameDisplay;
	    if (nameDisplay === 'block') {
	        nameElem.style.marginRight = '5px';
	    } else {
	        nameElem.style.marginRight = '';
	    }
	});

	if (currentLevel <= 5) {
		if (!isPoiHidden) {
			map.addOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
			isPoiHidden = true;
		}
		displayCCTVMarkers();
	} else {
		if (isPoiHidden) {
			map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TERRAIN);
			isPoiHidden = false;
		}
		displayedCCTVOverlays.forEach(function(overlay) {
			overlay.setMap(null);
		});
		displayedCCTVOverlays = [];
		cctvMarkerElements = [];
	}
});

// 드래그 완료 시 CCTV 마커 업데이트
kakao.maps.event.addListener(map, 'dragend', function() {
	if (map.getLevel() <= 5) {
		displayCCTVMarkers();
	}
});

/* ================= 동심원 기능 ================= */
var clickMarker = null;
var clickCircles = [];
var distanceLabels = [];

var circleOptions = [
	{ radius: 1000,  text: '1km',  color: '#FF0000' }, 
	{ radius: 2500,  text: '2.5km', color: '#FF7F00' }, 
	{ radius: 5000,  text: '5km',   color: '#EEEE00' }, 
	{ radius: 10000, text: '10km',  color: '#00FF00' }, 
	{ radius: 15000, text: '15km',  color: '#0000FF' }, 
	{ radius: 20000, text: '20km',  color: '#8B00FF' }  
];

function clearCircleOverlays() {
	if (clickMarker) {
		clickMarker.setMap(null);
		clickMarker = null;
	}
	clickCircles.forEach(function(circle) {
		circle.setMap(null);
	});
	clickCircles = [];
	
	distanceLabels.forEach(function(label) {
		label.setMap(null);
	});
	distanceLabels = [];
}

function getOffsetLatLng(baseLatLng, rMeter, angleDegree) {
	var earthRadius = 6378137;
	var dLat = (rMeter * Math.cos(Math.PI * angleDegree / 180)) / earthRadius;
	var dLng = (rMeter * Math.sin(Math.PI * angleDegree / 180)) / (earthRadius * Math.cos(Math.PI * baseLatLng.getLat() / 180));
	
	var resLat = baseLatLng.getLat() + (dLat * 180 / Math.PI);
	var resLng = baseLatLng.getLng() + (dLng * 180 / Math.PI);
	return new kakao.maps.LatLng(resLat, resLng);
}

kakao.maps.event.addListener(map, 'dblclick', function(mouseEvent) {
	var clickedPosition = mouseEvent.latLng;

	clearCircleOverlays();

	clickMarker = new kakao.maps.Marker({
		position: clickedPosition
	});
	clickMarker.setMap(map);

	circleOptions.forEach(function(opt) {
		var circle = new kakao.maps.Circle({
			center : clickedPosition,       
			radius: opt.radius,             
			strokeWeight: 2,                
			strokeColor: opt.color,         
			strokeOpacity: 0.8,             
			strokeStyle: 'dashed',          
			fillColor: opt.color,           
			fillOpacity: 0.15               
		});
		circle.setMap(map);
		clickCircles.push(circle);

		var rightPosition = getOffsetLatLng(clickedPosition, opt.radius, 90);
		var leftPosition = getOffsetLatLng(clickedPosition, opt.radius, 270);

		var rightLabel = new kakao.maps.CustomOverlay({
			position: rightPosition,
			content: '<div class="distance-label">' + opt.text + '</div>',
			xAnchor: 0.0,
			yAnchor: 0.5
		});
		rightLabel.setMap(map);
		distanceLabels.push(rightLabel);

		var leftLabel = new kakao.maps.CustomOverlay({
			position: leftPosition,
			content: '<div class="distance-label">' + opt.text + '</div>',
			xAnchor: 1.0,
			yAnchor: 0.5
		});
		leftLabel.setMap(map);
		distanceLabels.push(leftLabel);
	});
});

window.addEventListener('keydown', function(event) {
	if (event.key === 'Escape' || event.keyCode === 27) {
		clearCircleOverlays();
	}
});

/* ================= 경계선 표시 ================= */
fetch('skorea_municipalities_geo_simple.json')
.then(response => response.json())
.then(geojson => {
	var features = geojson.features;
	features.forEach(feature => {
		if(feature.properties.code.startsWith('32')) {
			var geometry = feature.geometry;
			var regionName = feature.properties.name;

			var latSum = 0, lngSum = 0, coordCount = 0;

			if (geometry.type === 'Polygon') {
				geometry.coordinates.forEach(function(coordinateRing) {
					drawPreciseLine(coordinateRing);
					coordinateRing.forEach(function(coord) {
						lngSum += coord[0]; 
						latSum += coord[1]; 
						coordCount++;
					});
				});
			} else if (geometry.type === 'MultiPolygon') {
				geometry.coordinates.forEach(function(polygonComponent) {
					polygonComponent.forEach(function(coordinateRing) {
						drawPreciseLine(coordinateRing);
						coordinateRing.forEach(function(coord) {
							lngSum += coord[0]; 
							latSum += coord[1]; 
							coordCount++;
						});
					});
				});
			}

			if (coordCount > 0) {
				var centerLat = latSum / coordCount;
				var centerLng = lngSum / coordCount;

				if (regionName === '강릉시') { centerLat -= 0.04; centerLng -= 0.04; }
				if (regionName === '홍천군') { centerLng -= 0.07; }
				if (regionName === '삼척시') { centerLat -= 0.05; }

				new kakao.maps.CustomOverlay({
					position: new kakao.maps.LatLng(centerLat, centerLng),
					content: '<div class="region-label">' + regionName + '</div>',
					xAnchor: 0.5,
					yAnchor: 0.5
				}).setMap(map);
			}
		}
	});
})
.catch(error => console.error('정밀 경계 로드 오류:', error));

function drawPreciseLine(coordinateRing) {
	var path = [];
	coordinateRing.forEach(function(coord) {
		path.push(new kakao.maps.LatLng(coord[1], coord[0]));
	});

	var polygon = new kakao.maps.Polygon({
		path: path,
		strokeWeight: 1,         
		strokeColor: '#FF0000',    
		strokeOpacity: 1.0,      
		strokeStyle: 'solid',    
		fillColor: '#FF0000',      
		fillOpacity: 0.02         
	});

	polygon.setMap(map);
}
</script>
</body>
</html>
